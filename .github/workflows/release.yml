name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build offline file
        run: npm run build:offline
        env:
          OFFLINE: '1'
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist-offline/web-astronomical-simulator.html
          body: |
            Download `web-astronomical-simulator.html` and open that file in a browser. GitHub does not run it.

            The live app is https://jopo12321.github.io/web-astronomical-simulator/

            The user guide is https://github.com/Jopo12321/web-astronomical-simulator/blob/main/docs/GUIDE.md
